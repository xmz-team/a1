name: Build cxxa1

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      clean_build:
        description: 'Clean build'
        required: true
        default: true
        type: boolean
      upload_artifacts:
        description: 'Upload artifacts'
        required: true
        default: true
        type: boolean

jobs:
  build-cxxa1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-16 \
            lld-16 \
            cmake \
            make \
            git \
            zip \
            libc6-dev \
            libstdc++-12-dev \
            pkg-config \
            libssl-dev \
            zlib1g-dev \
            libcurl4-openssl-dev
          
          # Set clang-16 as default
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-16 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-16 100
          sudo update-alternatives --install /usr/bin/llvm-ar llvm-ar /usr/bin/llvm-ar-16 100
          sudo update-alternatives --install /usr/bin/llvm-ranlib llvm-ranlib /usr/bin/llvm-ranlib-16 100
          
          mkdir -p libs && cd libs
          git clone https://github.com/xmz-team/libxmz.git
          git clone https://github.com/ThePhD/sol2.git
          git clone https://github.com/lua/lua.git
          git clone https://github.com/curl/curl.git
          git clone https://github.com/openssl/openssl.git
          git clone https://github.com/nih-at/libzip.git
          cd ..

      - name: Set environment variables
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "RANLIB=llvm-ranlib" >> $GITHUB_ENV
          
          if [ "${{ github.event.inputs.build_type }}" == "debug" ]; then
            echo "CFLAGS=-g -O0 -fPIC -static-libgcc -static-libstdc++" >> $GITHUB_ENV
            echo "CXXFLAGS=-g -O0 -fPIC -static-libgcc -static-libstdc++ -std=c++17" >> $GITHUB_ENV
          else
            echo "CFLAGS=-O3 -fPIC -static-libgcc -static-libstdc++ -flto=thin" >> $GITHUB_ENV
            echo "CXXFLAGS=-O3 -fPIC -static-libgcc -static-libstdc++ -std=c++17 -flto=thin" >> $GITHUB_ENV
          fi
          
          echo "LDFLAGS=-static-libgcc -static-libstdc++ -flto=thin -fuse-ld=lld" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig" >> $GITHUB_ENV

      - name: Clean build directory
        if: github.event.inputs.clean_build == 'true'
        run: |
          rm -rf output
          mkdir -p output

      - name: Build lua
        run: |
          cd libs/lua
          make a CC=$CC CFLAGS="$CFLAGS" AR="$AR rcu" RANLIB="$RANLIB"
          cd ../..

      - name: Build openssl
        run: |
          cd libs/openssl
          ./Configure linux-x86_64-clang --prefix=$PWD/install \
            --openssldir=$PWD/install/ssl \
            no-shared no-tests \
            -fPIC
          make -j$(nproc) && make install_sw
          cd ../..

      - name: Build curl (static)
        run: |
          cd libs/curl
          ./configure \
            --host=x86_64-pc-linux-gnu \
            --with-ssl=${{ github.workspace }}/libs/openssl/install \
            --enable-static --disable-shared \
            --without-libssh2 --without-nghttp2 \
            --disable-ftp --disable-file --disable-ldap \
            --disable-rtsp --disable-telnet --disable-tftp \
            --disable-pop3 --disable-imap --disable-smtp \
            --disable-gopher --disable-smb --disable-mqtt \
            --without-brotli --without-zstd \
            --with-zlib=/usr \
            CFLAGS="$CFLAGS" CXXFLAGS="$CXXFLAGS" LDFLAGS="$LDFLAGS"
          make -j$(nproc)
          cd ../..

      - name: Build libzip (static)
        run: |
          cd libs/libzip
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_C_COMPILER=$CC \
            -DCMAKE_CXX_COMPILER=$CXX \
            -DCMAKE_C_FLAGS="$CFLAGS" \
            -DCMAKE_CXX_FLAGS="$CXXFLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$LDFLAGS" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_REGRESS=OFF \
            -DBUILD_TOOLS=OFF \
            -DENABLE_LZMA=OFF \
            -DENABLE_BZIP2=OFF \
            -DENABLE_OPENSSL=OFF \
            -DENABLE_WINDOWS_CRYPTO=OFF \
            -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type == 'debug' && 'Debug' || 'Release' }}
          make -j$(nproc)
          cd ../../..

      - name: Build sol2
        run: |
          cd libs/sol2
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_CXX_COMPILER=$CXX \
            -DCMAKE_CXX_FLAGS="$CXXFLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$LDFLAGS" \
            -DSOL2_LUA_VERSION=510 \
            -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type == 'debug' && 'Debug' || 'Release' }}
          make -j$(nproc)
          cd ../../..

      - name: Create output directory
        run: mkdir -p output

      - name: Build cxxa1 (static)
        run: |
          cd src/cxxa1
          ./build
          $CXX \
            $CXXFLAGS \
            -I. \
            -I../bin/bundle \
            -I../../libs/libxmz \
            -I../../libs/sol2/include \
            -I../../libs/lua \
            -I../../libs/libzip/build \
            -I../../libs/openssl/install/include \
            -I../../libs/curl/include \
            src/cxxa1.cc \
            ../../libs/lua/liblua.a \
            ../../libs/libzip/build/lib/*.a \
            ../../libs/openssl/install/lib/*.a \
            ../../libs/curl/lib/*.a \
            -lssl -lcrypto -lz -ldl -lpthread \
            -Wl,-Bstatic -lstdc++ -lgcc -lgcc_eh \
            -Wl,-Bdynamic \
            -o ../../output/cxxa1
          cd ../..

      - name: Build cxxa1ctl (static)
        run: |
          cd src/cxxa1
          $CXX \
            $CXXFLAGS \
            -I. \
            -I../bin/bundle \
            -I../../libs/libxmz \
            -I../../libs/libzip/build \
            -I../../libs/openssl/install/include \
            src/cxxa1ctl.cc \
            ../../libs/libzip/build/lib/*.a \
            ../../libs/openssl/install/lib/*.a \
            -lssl -lcrypto -lz -ldl -lpthread \
            -Wl,-Bstatic -lstdc++ -lgcc -lgcc_eh \
            -Wl,-Bdynamic \
            -o ../../output/cxxa1ctl
          cd ../..

      - name: Build cxxa1mod (static)
        run: |
          cd src/cxxa1
          $CXX \
            $CXXFLAGS \
            -I. \
            -I../bin/bundle \
            -I../../libs/libxmz \
            -I../../libs/sol2/include \
            -I../../libs/lua/src \
            -I../../libs/libzip/build \
            -I../../libs/openssl/install/include \
            src/cxxa1mod.cc \
            ../../libs/lua/src/*.c \
            ../../libs/libzip/build/lib/*.a \
            ../../libs/openssl/install/lib/*.a \
            -lssl -lcrypto -lz -ldl -lpthread \
            -Wl,-Bstatic -lstdc++ -lgcc -lgcc_eh \
            -Wl,-Bdynamic \
            -o ../../output/cxxa1mod
          cd ../..

      - name: Build cxxa1pm (static)
        run: |
          cd src/cxxa1
          $CXX \
            $CXXFLAGS \
            -I. \
            -I../bin/bundle \
            -I../../libs/libxmz \
            -I../../libs/sol2/include \
            -I../../libs/lua/src \
            -I../../libs/libzip/build \
            -I../../libs/openssl/install/include \
            -I../../libs/curl/include \
            src/cxxa1pm.cc \
            ../../libs/lua/src/*.c \
            ../../libs/libzip/build/lib/*.a \
            ../../libs/openssl/install/lib/*.a \
            ../../libs/curl/lib/*.a \
            -lssl -lcrypto -lz -ldl -lpthread \
            -Wl,-Bstatic -lstdc++ -lgcc -lgcc_eh \
            -Wl,-Bdynamic \
            -o ../../output/cxxa1pm
          cd ../..

      - name: Build a1cil.sh
        run: |
          cd src/cxxa1
          cp src/a1cil.sh ../../output/a1cil
          chmod +x ../../output/a1cil
          cd ../..
      
      - name: Create symbolic links
        run: |
          cd output
          ln -sf cxxa1 a1
          ln -sf cxxa1ctl a1ctl
          ln -sf cxxa1mod a1mod
          ln -sf cxxa1pm a1pm
          cd ..

      - name: Strip binaries (release only)
        if: github.event.inputs.build_type != 'debug'
        run: |
          strip -s output/cxxa1
          strip -s output/cxxa1ctl
          strip -s output/cxxa1mod
          strip -s output/cxxa1pm

      - name: Archive output
        if: github.event.inputs.upload_artifacts != 'false'
        run: |
          zip -r -9 output.zip output

      - name: Upload build artifacts
        if: github.event.inputs.upload_artifacts != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: cxxa1-binaries-linux-${{ github.event.inputs.build_type }}-${{ github.sha }}
          path: output.zip
          if-no-files-found: error
          
      - name: Upload debug symbols (debug build only)
        if: github.event.inputs.build_type == 'debug' && github.event.inputs.upload_artifacts != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: cxxa1-debug-symbols-${{ github.sha }}
          path: output/*.debug
          if-no-files-found: warn

name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      clean_build:
        description: 'Clean build'
        required: true
        default: true
        type: boolean
      upload_artifacts:
        description: 'Upload artifacts'
        required: true
        default: true
        type: boolean

jobs:
  build-cxxa1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-16 \
            lld-16 \
            llvm-16 \
            cmake \
            make \
            zip \
            unzip \
            git \
            wget \
            libssl-dev \
            libcurl4-openssl-dev \
            pkg-config \
            autoconf \
            automake \
            libtool

          sudo ln -sf /usr/bin/llvm-ar-16 /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-ranlib-16 /usr/local/bin/llvm-ranlib
          sudo ln -sf /usr/bin/llvm-nm-16 /usr/local/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-strip-16 /usr/local/bin/llvm-strip
          
          mkdir -p libs && cd libs
          git clone https://github.com/xmz-team/libxmz.git
          git clone https://github.com/ThePhD/sol2.git
          git clone https://github.com/lua/lua.git
          git clone https://github.com/curl/curl.git
          git clone https://github.com/openssl/openssl.git
          git clone https://github.com/nih-at/libzip.git
          git clone https://github.com/xybp888/iOS-SDKs.git
          cd ..

      - name: Setup iOS toolchain
        run: |
          SDKROOT="${{ github.workspace }}/libs/iOS-SDKs/iPhoneOS16.5.sdk"
          echo "SDKROOT=$SDKROOT" >> $GITHUB_ENV
          
          echo "CC=clang-16" >> $GITHUB_ENV
          echo "CXX=clang++-16" >> $GITHUB_ENV
          echo "AR=llvm-ar-16" >> $GITHUB_ENV
          echo "RANLIB=llvm-ranlib-16" >> $GITHUB_ENV
          echo "NM=llvm-nm-16" >> $GITHUB_ENV
          
          IOS_FLAGS="-target arm64-apple-ios14.0 -isysroot $SDKROOT -miphoneos-version-min=14.0"
          
          if [ "${{ github.event.inputs.build_type }}" == "debug" ]; then
            echo "CFLAGS=$IOS_FLAGS -g -O0 -fPIC" >> $GITHUB_ENV
            echo "CXXFLAGS=$IOS_FLAGS -std=c++17 -g -O0 -fPIC" >> $GITHUB_ENV
          else
            echo "CFLAGS=$IOS_FLAGS -O3 -fPIC" >> $GITHUB_ENV
            echo "CXXFLAGS=$IOS_FLAGS -std=c++17 -O3 -fPIC" >> $GITHUB_ENV
          fi
          
          echo "LDFLAGS=-target arm64-apple-ios14.0 -isysroot $SDKROOT -miphoneos-version-min=14.0 -fPIC" >> $GITHUB_ENV
          echo "CPPFLAGS=-isysroot $SDKROOT -miphoneos-version-min=14.0" >> $GITHUB_ENV
          
          echo "PKG_CONFIG_PATH=${{ github.workspace }}/libs/openssl/install/lib/pkgconfig" >> $GITHUB_ENV
          echo "PKG_CONFIG_SYSROOT_DIR=$SDKROOT" >> $GITHUB_ENV

      - name: Clean build directory
        if: github.event.inputs.clean_build == 'true'
        run: |
          rm -rf output
          mkdir -p output

      - name: Build lua
        run: |
          cd libs/lua
          make posix CC=gcc CFLAGS="-O2 -DLUA_USE_LINUX" AR="ar rcu" RANLIB="ranlib"
          make clean
          make macosx CC=$CC CFLAGS="$CFLAGS -DLUA_USE_MACOSX" AR="ar rcu" RANLIB="$RANLIB"
          cd ../..

      - name: Build openssl
        run: |
          cd libs/openssl
          make clean || true
          
          ./Configure iphoneos-cross \
            --prefix=$PWD/install \
            -isysroot $SDKROOT \
            -miphoneos-version-min=14.0 \
            no-shared \
            no-tests
            
          make -j$(nproc) && make install_sw
          cd ../..

      - name: Build curl with CMake
        run: |
          cd libs/curl
          rm -rf build && mkdir -p build && cd build
          
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=$SDKROOT \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_C_COMPILER=clang-16 \
            -DCMAKE_C_COMPILER_TARGET=arm64-apple-ios14.0 \
            -DCMAKE_C_COMPILER_WORKS=1 \
            -DCMAKE_C_FLAGS="-miphoneos-version-min=14.0 -fPIC" \
            -DCMAKE_EXE_LINKER_FLAGS="-miphoneos-version-min=14.0" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_CURL_EXE=OFF \
            -DBUILD_TESTING=OFF \
            -DCURL_USE_OPENSSL=ON \
            -DOPENSSL_ROOT_DIR=${{ github.workspace }}/libs/openssl/install \
            -DOPENSSL_INCLUDE_DIR=${{ github.workspace }}/libs/openssl/install/include \
            -DOPENSSL_SSL_LIBRARY=${{ github.workspace }}/libs/openssl/install/lib/libssl.a \
            -DOPENSSL_CRYPTO_LIBRARY=${{ github.workspace }}/libs/openssl/install/lib/libcrypto.a \
            -DCURL_DISABLE_LDAP=ON \
            -DCURL_DISABLE_LDAPS=ON \
            -DCURL_DISABLE_TELNET=ON \
            -DCURL_DISABLE_DICT=ON \
            -DCURL_DISABLE_FILE=ON \
            -DCURL_DISABLE_TFTP=ON \
            -DCURL_DISABLE_RTSP=ON \
            -DCURL_DISABLE_POP3=ON \
            -DCURL_DISABLE_IMAP=ON \
            -DCURL_DISABLE_SMTP=ON \
            -DCURL_DISABLE_GOPHER=ON \
            -DCURL_DISABLE_MQTT=ON \
            -DCURL_ZLIB=OFF \
            -DCURL_BROTLI=OFF \
            -DCURL_ZSTD=OFF \
            -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type == 'debug' && 'Debug' || 'Release' }}
          
          make -j$(nproc)
          cd ../../..

      - name: Build libzip
        run: |
          cd libs/libzip
          rm -rf build && mkdir -p build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=$SDKROOT \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_C_COMPILER=$CC \
            -DCMAKE_C_COMPILER_TARGET=arm64-apple-ios14.0 \
            -DCMAKE_C_FLAGS="$CFLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$LDFLAGS" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_REGRESS=OFF \
            -DBUILD_TOOLS=OFF \
            -DENABLE_LZMA=OFF \
            -DENABLE_BZIP2=OFF \
            -DENABLE_OPENSSL=OFF \
            -DENABLE_WINDOWS_CRYPTO=OFF \
            -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type == 'debug' && 'Debug' || 'Release' }}
          make -j$(nproc)
          cd ../../..

      - name: Build sol2
        run: |
          cd libs/sol2
          rm -rf build && mkdir -p build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=$SDKROOT \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_CXX_COMPILER=$CXX \
            -DCMAKE_CXX_COMPILER_TARGET=arm64-apple-ios14.0 \
            -DCMAKE_CXX_FLAGS="$CXXFLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$LDFLAGS" \
            -DSOL2_LUA_VERSION=510 \
            -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type == 'debug' && 'Debug' || 'Release' }}
          make -j$(nproc)
          cd ../../..

      - name: Create output directory
        run: mkdir -p output

      - name: Build cxxa1
        run: |
          cd src/cxxa1
          ./build
          $CXX -x objective-c++ \
            $CXXFLAGS \
            -I. \
            -I../bin/bundle \
            -I../../libs/libxmz \
            -I../../libs/sol2/include \
            -I../../libs/lua \
            -I../../libs/libzip/build \
            -I../../libs/openssl/include \
            -I../../libs/curl/include \
            -framework Foundation -framework Security \
            src/cxxa1.cc \
            ../../libs/lua/liblua.a \
            ../../libs/libzip/build/lib/*.a \
            ../../libs/openssl/install/lib/*.a \
            ../../libs/curl/build/lib/*.a \
            -o ../../output/cxxa1 \
            -static-libstdc++ -static-libgcc
          cd ../..

      - name: Build cxxa1ctl
        run: |
          cd src/cxxa1
          $CXX -x objective-c++ \
            $CXXFLAGS \
            -I. \
            -I../bin/bundle \
            -I../../libs/libxmz \
            -I../../libs/libzip/build \
            -I../../libs/openssl/include \
            -framework Foundation -framework Security \
            src/cxxa1ctl.cc \
            ../../libs/libzip/build/lib/*.a \
            ../../libs/openssl/install/lib/*.a \
            -o ../../output/cxxa1ctl \
            -static-libstdc++ -static-libgcc
          cd ../..

      - name: Build cxxa1mod
        run: |
          cd src/cxxa1
          $CXX -x objective-c++ \
            $CXXFLAGS \
            -I. \
            -I../bin/bundle \
            -I../../libs/libxmz \
            -I../../libs/sol2/include \
            -I../../libs/lua/src \
            -I../../libs/libzip/build \
            -I../../libs/openssl/include \
            -framework Foundation -framework Security \
            src/cxxa1mod.cc \
            ../../libs/lua/src/*.c \
            ../../libs/libzip/build/lib/*.a \
            ../../libs/openssl/install/lib/*.a \
            -o ../../output/cxxa1mod \
            -static-libstdc++ -static-libgcc
          cd ../..

      - name: Build cxxa1pm
        run: |
          cd src/cxxa1
          $CXX -x objective-c++ \
            $CXXFLAGS \
            -I. \
            -I../bin/bundle \
            -I../../libs/libxmz \
            -I../../libs/sol2/include \
            -I../../libs/lua/src \
            -I../../libs/libzip/build \
            -I../../libs/openssl/include \
            -I../../libs/curl/include \
            -framework Foundation -framework Security \
            src/cxxa1pm.cc \
            ../../libs/lua/src/*.c \
            ../../libs/libzip/build/lib/*.a \
            ../../libs/openssl/install/lib/*.a \
            ../../libs/curl/build/lib/*.a \
            -o ../../output/cxxa1pm \
            -static-libstdc++ -static-libgcc
          cd ../..

      - name: Build a1cil.sh
        run: |
          cd src/cxxa1
          cp src/a1cil.sh ../../output/a1cil
          chmod +x ../../output/a1cil
          cd ../..
      
      - name: Create symbolic links
        run: |
          cd output
          ln -sf cxxa1 a1
          ln -sf cxxa1ctl a1ctl
          ln -sf cxxa1mod a1mod
          ln -sf cxxa1pm a1pm
          cd ..

      - name: Archive output
        if: github.event.inputs.upload_artifacts != 'false'
        run: |
          zip -r -9 output.zip output

      - name: Upload build artifacts
        if: github.event.inputs.upload_artifacts != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: cxxa1-binaries-${{ github.event.inputs.build_type }}-${{ github.sha }}
          path: output.zip
          if-no-files-found: error
          
      - name: Upload debug symbols (debug build only)
        if: github.event.inputs.build_type == 'debug' && github.event.inputs.upload_artifacts != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: cxxa1-debug-symbols-${{ github.sha }}
          path: output/*.dSYM
          if-no-files-found: warn

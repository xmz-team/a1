name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      clean_build:
        description: 'Clean build'
        required: true
        default: true
        type: boolean
      upload_artifacts:
        description: 'Upload artifacts'
        required: true
        default: true
        type: boolean

jobs:
  build-cxxa1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-16 \
            lld-16 \
            llvm-16 \
            cmake \
            make \
            zip \
            unzip \
            git \
            wget \
            libssl-dev \
            libcurl4-openssl-dev \
            autoconf \
            automake \
            libtool \
            pkg-config
          
          # Create symlinks for llvm tools
          sudo ln -sf /usr/bin/llvm-ar-16 /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-ranlib-16 /usr/local/bin/llvm-ranlib
          sudo ln -sf /usr/bin/llvm-nm-16 /usr/local/bin/llvm-nm
          
          mkdir -p libs && cd libs
          git clone https://github.com/xmz-team/libxmz.git
          git clone https://github.com/ThePhD/sol2.git
          git clone https://github.com/lua/lua.git
          git clone https://github.com/curl/curl.git
          git clone https://github.com/openssl/openssl.git
          git clone https://github.com/nih-at/libzip.git
          git clone https://github.com/xybp888/iOS-SDKs.git
          cd ..

      - name: Setup iOS toolchain
        run: |
          # Set up environment variables for iOS cross-compilation
          SDKROOT="${{ github.workspace }}/libs/iOS-SDKs/iPhoneOS16.5.sdk"
          echo "SDKROOT=$SDKROOT" >> $GITHUB_ENV
          
          # Use clang directly (not with target in CC)
          echo "CC=clang-16" >> $GITHUB_ENV
          echo "CXX=clang++-16" >> $GITHUB_ENV
          
          # iOS-specific flags
          IOS_TARGET="-target arm64-apple-ios14.0"
          IOS_SYSROOT="-isysroot $SDKROOT"
          IOS_MIN="-miphoneos-version-min=14.0"
          
          if [ "${{ github.event.inputs.build_type }}" == "debug" ]; then
            echo "CFLAGS=$IOS_TARGET $IOS_SYSROOT $IOS_MIN -g -O0 -fPIC" >> $GITHUB_ENV
            echo "CXXFLAGS=$IOS_TARGET $IOS_SYSROOT $IOS_MIN -std=c++17 -g -O0 -fPIC" >> $GITHUB_ENV
          else
            echo "CFLAGS=$IOS_TARGET $IOS_SYSROOT $IOS_MIN -O3 -fPIC" >> $GITHUB_ENV
            echo "CXXFLAGS=$IOS_TARGET $IOS_SYSROOT $IOS_MIN -std=c++17 -O3 -fPIC" >> $GITHUB_ENV
          fi
          
          echo "LDFLAGS=$IOS_TARGET $IOS_SYSROOT $IOS_MIN -fPIC" >> $GITHUB_ENV
          echo "CPPFLAGS=$IOS_SYSROOT $IOS_MIN" >> $GITHUB_ENV
          
          # Cross-compilation environment variables
          echo "ac_cv_func_malloc_0_nonnull=yes" >> $GITHUB_ENV
          echo "ac_cv_func_realloc_0_nonnull=yes" >> $GITHUB_ENV
          echo "ac_cv_func_memcmp_working=yes" >> $GITHUB_ENV
          
          echo "PKG_CONFIG_PATH=${{ github.workspace }}/libs/openssl/install/lib/pkgconfig" >> $GITHUB_ENV
          echo "PKG_CONFIG_SYSROOT_DIR=$SDKROOT" >> $GITHUB_ENV

      - name: Clean build directory
        if: github.event.inputs.clean_build == 'true'
        run: |
          rm -rf output
          mkdir -p output

      - name: Build lua
        run: |
          cd libs/lua
          sed -i '138c\
          static int l_system_fork_exec(const char *cmd) {\
              pid_t pid = fork();\
              if (pid == -1) {\
                  return -1;\
              } else if (pid == 0) {\
                  execlp("sh", "sh", "-c", cmd, (char *)NULL);\
                  _exit(127);\
              } else {\
                  int status;\
                  waitpid(pid, &status, 0);\
                  return status;\
              }\
          }\
          #define l_system(cmd) l_system_fork_exec(cmd)' loslib.c
          
          make a CC="$CC" CFLAGS="$CFLAGS -DLUA_USE_MACOSX" AR="llvm-ar rcu" RANLIB="llvm-ranlib"
          cd ../..

      - name: Build openssl
        run: |
          cd libs/openssl
          ./Configure iphoneos-cross --prefix=$PWD/install \
            --cross-compile-prefix= \
            CC="clang-16" \
            CFLAGS="-target arm64-apple-ios14.0 -isysroot $SDKROOT -miphoneos-version-min=14.0 -fPIC"
          make -j$(nproc) && make install_sw
          cd ../..

      - name: Build curl with CMake
        run: |
          cd libs/curl
          rm -rf build && mkdir -p build && cd build
          
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=$SDKROOT \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_C_COMPILER=clang-16 \
            -DCMAKE_C_COMPILER_TARGET=arm64-apple-ios14.0 \
            -DCMAKE_C_FLAGS="-miphoneos-version-min=14.0 -fPIC" \
            -DCMAKE_EXE_LINKER_FLAGS="-miphoneos-version-min=14.0" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_CURL_EXE=OFF \
            -DBUILD_TESTING=OFF \
            -DCURL_USE_OPENSSL=ON \
            -DOPENSSL_ROOT_DIR=${{ github.workspace }}/libs/openssl/install \
            -DOPENSSL_INCLUDE_DIR=${{ github.workspace }}/libs/openssl/install/include \
            -DOPENSSL_SSL_LIBRARY=${{ github.workspace }}/libs/openssl/install/lib/libssl.a \
            -DOPENSSL_CRYPTO_LIBRARY=${{ github.workspace }}/libs/openssl/install/lib/libcrypto.a \
            -DCURL_DISABLE_LDAP=ON \
            -DCURL_DISABLE_LDAPS=ON \
            -DCURL_DISABLE_TELNET=ON \
            -DCURL_DISABLE_DICT=ON \
            -DCURL_DISABLE_FILE=ON \
            -DCURL_DISABLE_TFTP=ON \
            -DCURL_DISABLE_RTSP=ON \
            -DCURL_DISABLE_POP3=ON \
            -DCURL_DISABLE_IMAP=ON \
            -DCURL_DISABLE_SMTP=ON \
            -DCURL_DISABLE_GOPHER=ON \
            -DCURL_DISABLE_MQTT=ON \
            -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type == 'debug' && 'Debug' || 'Release' }}
          
          make -j$(nproc)
          cd ../../..

      - name: Build libzip
        run: |
          cd libs/libzip
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=$SDKROOT \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_C_COMPILER=$CC \
            -DCMAKE_CXX_COMPILER=$CXX \
            -DCMAKE_C_FLAGS="$CFLAGS" \
            -DCMAKE_CXX_FLAGS="$CXXFLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$LDFLAGS" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_REGRESS=OFF \
            -DBUILD_TOOLS=OFF \
            -DENABLE_LZMA=OFF \
            -DENABLE_BZIP2=OFF \
            -DENABLE_OPENSSL=OFF \
            -DENABLE_WINDOWS_CRYPTO=OFF \
            -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type == 'debug' && 'Debug' || 'Release' }}
          make -j$(nproc)
          cd ../../..

      - name: Build sol2
        run: |
          cd libs/sol2
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=$SDKROOT \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_CXX_COMPILER=$CXX \
            -DCMAKE_CXX_FLAGS="$CXXFLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$LDFLAGS" \
            -DSOL2_LUA_VERSION=510 \
            -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type == 'debug' && 'Debug' || 'Release' }}
          make -j$(nproc)
          cd ../../..

      - name: Create output directory
        run: mkdir -p output

      - name: Build cxxa1
        run: |
          cd src/cxxa1
          ./build
          $CXX -x objective-c++ \
            $CXXFLAGS \
            -I. \
            -I../bin/bundle \
            -I../../libs/libxmz \
            -I../../libs/sol2/include \
            -I../../libs/lua \
            -I../../libs/libzip/build \
            -I../../libs/openssl/include \
            -I../../libs/curl/include \
            -framework Foundation -framework Security \
            src/cxxa1.cc \
            ../../libs/lua/liblua.a \
            ../../libs/libzip/build/lib/*.a \
            ../../libs/openssl/install/lib/*.a \
            ../../libs/curl/build/lib/*.a \
            -o ../../output/cxxa1 \
            -static-libstdc++ -static-libgcc
          cd ../..

      - name: Build cxxa1ctl
        run: |
          cd src/cxxa1
          $CXX -x objective-c++ \
            $CXXFLAGS \
            -I. \
            -I../bin/bundle \
            -I../../libs/libxmz \
            -I../../libs/libzip/build \
            -I../../libs/openssl/include \
            -framework Foundation -framework Security \
            src/cxxa1ctl.cc \
            ../../libs/libzip/build/lib/*.a \
            ../../libs/openssl/install/lib/*.a \
            -o ../../output/cxxa1ctl \
            -static-libstdc++ -static-libgcc
          cd ../..

      - name: Build cxxa1mod
        run: |
          cd src/cxxa1
          $CXX -x objective-c++ \
            $CXXFLAGS \
            -I. \
            -I../bin/bundle \
            -I../../libs/libxmz \
            -I../../libs/sol2/include \
            -I../../libs/lua/src \
            -I../../libs/libzip/build \
            -I../../libs/openssl/include \
            -framework Foundation -framework Security \
            src/cxxa1mod.cc \
            ../../libs/lua/src/*.c \
            ../../libs/libzip/build/lib/*.a \
            ../../libs/openssl/install/lib/*.a \
            -o ../../output/cxxa1mod \
            -static-libstdc++ -static-libgcc
          cd ../..

      - name: Build cxxa1pm
        run: |
          cd src/cxxa1
          $CXX -x objective-c++ \
            $CXXFLAGS \
            -I. \
            -I../bin/bundle \
            -I../../libs/libxmz \
            -I../../libs/sol2/include \
            -I../../libs/lua/src \
            -I../../libs/libzip/build \
            -I../../libs/openssl/include \
            -I../../libs/curl/include \
            -framework Foundation -framework Security \
            src/cxxa1pm.cc \
            ../../libs/lua/src/*.c \
            ../../libs/libzip/build/lib/*.a \
            ../../libs/openssl/install/lib/*.a \
            ../../libs/curl/build/lib/*.a \
            -o ../../output/cxxa1pm \
            -static-libstdc++ -static-libgcc
          cd ../..

      - name: Build a1cil.sh
        run: |
          cd src/cxxa1
          cp src/a1cil.sh ../../output/a1cil
          chmod +x ../../output/a1cil
          cd ../..
      
      - name: Create symbolic links
        run: |
          cd output
          ln -sf cxxa1 a1
          ln -sf cxxa1ctl a1ctl
          ln -sf cxxa1mod a1mod
          ln -sf cxxa1pm a1pm
          cd ..

      - name: Archive output
        if: github.event.inputs.upload_artifacts != 'false'
        run: |
          zip -r -9 output.zip output

      - name: Upload build artifacts
        if: github.event.inputs.upload_artifacts != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: cxxa1-binaries-${{ github.event.inputs.build_type }

name: Build and package cxxa1

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
#    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup
      run: |
        git -c url."https://github.com/".insteadOf="git@github.com:" submodule update --init --recursive
        ls -las libs/lua/
        chmod +x build
        chmod +x ci/*.sh
        alias 'c++'='clang++'
        alias 'cc'='clang'
        wget "https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64"
        chmod +x ldid_linux_x86_64
        alias 'ldid'="$(pwd)/ldid_linux_x86_64"

    - name: Build
      run: |
        ./build build-a1-all build-a1-tool

    - name: Package
      run: |
        ./build pack-all

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: cxxa1-packages
        path: packages/packdeb/
